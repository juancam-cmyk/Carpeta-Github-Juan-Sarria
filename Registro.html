<body>
    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
</head>


<h1>Crear cuenta</h1>
<p>Completa tus datos para registrarte.</p>

<hr>

<form action="login.html" method="get">
    <label for="nombre">Nombre completo:</label>
    <br>
    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

    <br>
    <br>

    <label for="usuario">Usuario:</label>
    <br>
    <input type="text" id="usuario" name="usuario" placeholder="Elige un usuario">

    <br>
    <br>

    <label for="correo">Correo electronico:</label>
    <br>
    <input type="email" id="correo" name="correo" placeholder="Escribe tu correo">

    <br>
    <br>

    <label for="password">Contraseña:</label>
    <br>
    <input type="password" id="password" name="password" placeholder="Crea una contraseña">

    <br>
    <br>

    <label for="password2">Confirmar contraseña:</label>
    <br>
    <input type="password" id="password2" name="password2" placeholder="Repite tu contraseña">

    <br>
    <br>

    <button type="submit">Registrarse</button>
</form>

<hr>

<p>¿Ya tienes cuenta? <a href="login.html">Inicia sesion aqui</a></p>


</body>
</html>
