<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
</head>
<body>

<h1>Inicio de sesion</h1>
<p>Ingresa tus datos para acceder a tu cuenta.</p>

<hr>

<form action="Pagina Graficas.html" method="get">
    <label for="usuario">Usuario:</label>
    <br>
    <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario">

    <br>
    <br>

    <label for="password">Contraseña:</label>
    <br>
    <input type="password" id="password" name="password" placeholder="Escribe tu contraseña">

    <br>
    <br>

    <input type="checkbox" id="recordar" name="recordar">
    <label for="recordar">Recordarme</label>

    <br>
    <br>

    <button type="submit">Iniciar sesion</button>
</form>

<hr>

<p>¿No tienes cuenta? <a href="Registro.html">Registrate aqui</a></p>

</body>
</html>
