<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vestuario DIM - Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/inventario.css">
</head>
<body class="bg-dark text-white">
    <!-- Navegación Responsiva (Mismo menú para mantener consistencia) -->
    <nav class="navbar navbar-expand-lg navbar-dark nav-dim sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../img/EscudoNuevo2026.png" alt="Escudo DIM" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#noticias">Noticias</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#servicios">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#videos">Videos</a></li>
                    <li class="nav-item"><a class="nav-link" href="../html/Calculadora.html">Calculadora</a></li>
                    <li class="nav-item"><a class="nav-link" href="../html/Inventario.html">Vestuario</a></li>
                    <li class="nav-item"><a class="nav-link" href="socio.html">Socios</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-danger border-bottom border-info d-inline-block pb-2">VESTUARIO DEL PODEROSO</h1>
            <p class="lead text-light">Gestión de indumentaria y ventas</p>
        </div>

        <!-- Panel de Control (Interacción con los Arrays del PDF) -->
        <div class="controles-vestuario bg-secondary bg-opacity-25 p-4 rounded mb-5 shadow">
            <h4 class="mb-3 text-danger">Acciones de Inventario</h4>
            <div class="d-flex flex-wrap gap-2">
                <button id="btn-agregar" class="btn btn-dark fw-bold">+ Agregar Producto</button>
                <button id="btn-quitar" class="btn btn-dark fw-bold">- Quitar Último</button>
                <button id="btn-filtrar" class="btn btn-dark text-light fw-bold">Filtrar Baratos</button>
                <button id="btn-iva" class="btn btn-dark text-light fw-bold">Ver Precios con IVA</button>
                <button id="btn-buscar" class="btn btn-outline-light fw-bold">¿Hay Camisetas?</button>
                <button id="btn-restaurar" class="btn btn-dark fw-bold">↻ Restaurar Lista</button>
            </div>
            <div id="mensaje-consola" class="mt-3 text-info fw-bold font-monospace"></div>
        </div>

        <!-- Exhibición del Inventario (El <ul> requerido por el PDF) -->
        <ul id="lista" class="row g-4 list-unstyled">
            <!-- Los casilleros se generarán aquí con JavaScript -->
        </ul>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/inventario.js"></script>
</body>
</html>
