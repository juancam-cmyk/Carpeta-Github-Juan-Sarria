<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Socios DIM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- ¡Esta es la línea que faltaba para controlar el tamaño del logo! -->
    <link rel="stylesheet" href="../css/style.css"> 
    
    <link rel="stylesheet" href="../css/socios.css">
</head>
<body class="bg-light text-dark">

    <!-- Navegación Responsiva -->
    <nav class="navbar navbar-expand-lg navbar-dark nav-dim sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <img src="../img/EscudoNuevo2026.png" alt="Escudo DIM" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="Calculadora.html">Calculadora</a></li>
                    <li class="nav-item"><a class="nav-link" href="Inventario.html">Vestuario</a></li>
                    <li class="nav-item"><a class="nav-link" href="socio.html">Socios</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold" style="color: #0b1c3a;">SISTEMA DE SOCIOS COMPRAR BOLETA</h1>
            <p class="lead text-muted">Validación y cálculo de abonos</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-danger text-white text-center fw-bold fs-5">
                        Solicitud de Abono
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Hincha:</label>
                            <input type="text" id="input-nombre" class="form-control" placeholder="Ej. Juan Camilo">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Edad:</label>
                            <input type="number" id="input-edad" class="form-control" placeholder="Ej. 20">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Tribuna:</label>
                            <select id="select-tribuna" class="form-select">
                                <option value="norte">Norte - La Resistencia</option>
                                <option value="sur">Sur - Familiar</option>
                                <option value="oriental">Oriental</option>
                                <option value="occidental">Occidental</option>
                            </select>
                        </div>
                        <button id="btn-procesar" class="btn btn-dark w-100 fw-bold fs-5 py-2">Procesar Solicitud</button>
                    </div>
                </div>

                <!-- Caja de Resultados -->
                <div id="caja-resultado" class="alert mt-4 d-none fw-bold text-center fs-5 shadow-sm" role="alert">
                    <!-- Aquí se mostrará el mensaje retornado por las funciones -->
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/socios.js"></script>
</body>
</html>
